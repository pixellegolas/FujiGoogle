  <path d="M 256 126 L 350 200 L 256 220 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M 370 200 L 370 320 L 285 260 Z" fill="#ffffff" opacity="0.8"/>
  <path d="M 360 330 L 260 380 L 260 280 Z" fill="#ffffff" opacity="0.9"/>
